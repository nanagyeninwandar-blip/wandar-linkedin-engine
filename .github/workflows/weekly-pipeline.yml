name: Weekly LinkedIn Pipeline

on:
  schedule:
    # Sunday 08:00 EDT (UTC-4, summer Mar-Nov)
    # In winter (EST, UTC-5) this fires at 07:00 — update to '0 13 * * 0' from November if needed
    - cron: '0 12 * * 0'
  workflow_dispatch:
    # Manual trigger available any time via GitHub Actions tab

jobs:
  pipeline:
    name: Run WANDAR LinkedIn Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          GDRIVE_FINAL_FOLDER_ID: ${{ secrets.GDRIVE_FINAL_FOLDER_ID }}
        run: python tools/run_pipeline.py

      - name: Slack alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"⚠️ *Wandar LinkedIn pipeline failed* — $(date +%Y-%m-%d)\n\nCheck the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
          else
            echo "SLACK_WEBHOOK_URL not set — skipping alert"
          fi
